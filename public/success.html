<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .confirm-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 96px 24px;
    text-align: center;
  }
  .check {
    width: 56px; height: 56px;
    background: var(--forest);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
  }
  .confirm-wrap h1 {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    margin: 0 0 12px;
  }
  .confirm-wrap p { color: var(--slate); font-size: 16px; line-height: 1.6; }
  #details {
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 24px;
    margin-top: 24px;
    text-align: left;
    font-size: 15px;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="confirm-wrap">
    <div class="check">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>You're booked in</h1>
<p>A confirmation has been sent to your email. We look forward to seeing you.</p>
<div id="details">Loading booking details…</div>
<a href="/" id="bookAnotherLink" class="btn-primary" style="display:inline-block;width:auto;margin-top:28px;text-decoration:none;">Book another visit</a>
</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get('booking');
    const businessSlug = params.get('business');
    if (businessSlug) {
      document.getElementById('bookAnotherLink').href = `/${businessSlug}`;
    }
    if (bookingId) {
      fetch(`/api/bookings/${bookingId}`)
        .then(r => r.json())
        .then(b => {
          document.getElementById('details').innerHTML = `
            <strong>${b.serviceName || 'Booking'}</strong><br>
            ${b.date} at ${b.time}<br>
            £${b.amountGBP} · ${b.status}
          `;
        })
        .catch(() => {
          document.getElementById('details').textContent = 'Could not load booking details.';
        });
    } else {
      document.getElementById('details').textContent = '';
    }
  </script>
</body>
</html>
