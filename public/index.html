<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="page" id="page">

  <header class="intro">
    <p class="eyebrow" id="statusBanner" hidden></p>
    <h1 class="brand" id="businessName">Loading…</h1>
    <p class="tagline" id="businessTagline"></p>
    <p class="about" id="businessAbout"></p>

    <div class="services" id="servicesList"></div>
  </header>

  <main class="widget-wrap">
    <div class="widget" id="widget">

      <div class="widget-header">
        <span class="widget-step" id="stepLabel">Step 1 of 3</span>
        <h2>Book your visit</h2>
      </div>

      <!-- Step 1: service -->
      <section class="step" id="step-service">
        <label class="field-label">Choose a service</label>
        <div class="service-options" id="serviceOptions"></div>
        <button class="btn-primary" id="toStep2" disabled>Continue</button>
      </section>

      <!-- Step 2: date + time -->
      <section class="step" id="step-time" hidden>
        <label class="field-label">Pick a date</label>
        <input type="date" id="dateInput" class="date-input">
        <label class="field-label" style="margin-top:20px;">Available times</label>
        <div class="slots" id="slots"><p class="muted">Choose a date to see availability.</p></div>
        <div class="step-actions">
          <button class="btn-ghost" id="backTo1">Back</button>
          <button class="btn-primary" id="toStep3" disabled>Continue</button>
        </div>
      </section>

      <!-- Step 3: details + pay -->
      <section class="step" id="step-details" hidden>
        <label class="field-label">Your details</label>
        <input type="text" id="nameInput" class="text-input" placeholder="Full name">
        <input type="email" id="emailInput" class="text-input" placeholder="Email">
        <input type="tel" id="phoneInput" class="text-input" placeholder="Phone (for booking reminders)">
        <textarea id="notesInput" class="text-input" placeholder="Anything we should know? (optional)" rows="3"></textarea>

        <div class="summary" id="summary"></div>

        <div class="step-actions">
          <button class="btn-ghost" id="backTo2">Back</button>
          <button class="btn-primary" id="payButton">Confirm and pay</button>
        </div>
        <p class="muted small" id="formError" hidden></p>
      </section>

    </div>
  </main>

</div>

<script src="/app.js"></script>
</body>
</html>
